# GPU Training Configuration for Volumetric 3D U-Net (BraTS 2021)
# Designed for execution on a CUDA-enabled GPU (>= 16-24 GB VRAM, e.g. NVIDIA RTX 3090/4090, A5000, A100)
# DO NOT run full training on an 8 GB Apple Silicon M1 machine.

model:
  name: "unet_3d"
  in_channels: 3               # T1CE, T2, FLAIR
  out_channels: 4              # 0: BG, 1: NCR/NET, 2: ED, 3: ET
  channels: [32, 64, 128, 256] # Standard full-capacity 3D U-Net channels
  strides: [2, 2, 2]
  num_res_units: 2
  dropout: 0.2

data:
  data_root: "data/BraTS2021_Training_Data"
  split_file: "data/splits/patients_split.json"
  patch_size: [96, 96, 96]     # Full clinical 3D patch resolution
  samples_per_volume: 4
  num_workers: 4
  pin_memory: true
  pos_ratio: 1.0               # Balanced 50% tumor / 50% background
  neg_ratio: 1.0

training:
  epochs: 100
  batch_size: 2                # 2 volumes x 4 crops = 8 volumetric patches per optimizer step
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-5
  scheduler: "cosine"
  mixed_precision: true        # torch.cuda.amp.autocast for FP16 throughput
  patience: 15                 # Early stopping patience
  seed: 42
  save_dir: "runs/exp_3d_final"
  resume: null                 # Optional path to checkpoint to resume training
  val_sliding_window: false    # Optional whole-volume sliding-window validation
  val_interval_epochs: 5       # Frequency (epochs) for whole-volume validation

loss:
  type: "ClassWeightedDiceCELoss"
  dice_weight: 0.5
  ce_weight: 0.5
  include_background: false
  ce_class_weights: [1.0, 2.0, 1.5, 2.0]
  dice_class_weights: [1.5, 1.0, 1.5]

inference:
  roi_size: [96, 96, 96]
  sw_batch_size: 4
  overlap: 0.5
  mode: "gaussian"
  apply_brain_mask: true
